<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SLIDE BULLET</title>
<style>
  :root{
    --bg-0:#05060a;
    --panel:#11141f;
    --line:rgba(255,255,255,0.07);
    --red:#ff3358;
    --red-soft:rgba(255,51,88,0.55);
    --blue:#2fb2ff;
    --blue-soft:rgba(47,178,255,0.55);
    --tile-white:#e7ebf5;
    --tile-white-dim:#aeb4c4;
    --text-dim:#7b8296;
    --text:#eef0f6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;
    background:radial-gradient(circle at 50% 20%, #141827 0%, var(--bg-0) 60%);
    color:var(--text);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    touch-action:none;
  }
  #app{
    position:relative;
    width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(10px,3vh,26px);
  }

  /* =====================================================================
     POP体風の見やすいフォント
     凝った加工はやめ、丸みのある極太サンセリフ+シンプルな縁取りのみ。
  ===================================================================== */
  .pixel-text{
    font-family:"Hiragino Maru Gothic ProN","Arial Rounded MT Bold","M PLUS Rounded 1c","Yu Gothic",system-ui,sans-serif;
    font-weight:800;
    letter-spacing:0.04em;
    color:var(--tone,#fff);
    text-shadow:0 2px 0 rgba(0,0,0,0.5);
  }

  /* ---------- HUD ---------- */
  #hud{ text-align:center; pointer-events:none; }
  #scoreLabel{
    --tone:var(--text-dim);
    font-size:clamp(11px,2.4vw,14px);
    margin-bottom:6px;
  }
  #scoreValue{
    --tone:var(--text);
    font-size:clamp(34px,9vw,54px);
    line-height:1.05;
    letter-spacing:0.03em;
    text-shadow:0 0 18px rgba(120,150,255,0.25);
    transition:transform 0.15s ease;
  }
  #scoreValue.pop{transform:scale(1.28);}

  /* ---------- Arena / Board ---------- */
  #arena{
    position:relative;
    width:min(84vmin,520px);
    height:min(84vmin,520px);
    display:flex;align-items:center;justify-content:center;
    touch-action:none;
  }
  #arena.shake{animation:shakeAnim 0.4s ease;}
  @keyframes shakeAnim{
    0%,100%{transform:translate(0,0);}
    20%{transform:translate(-8px,4px);}
    40%{transform:translate(7px,-5px);}
    60%{transform:translate(-6px,-3px);}
    80%{transform:translate(6px,4px);}
  }

  #board{
    position:relative;
    width:64%;
    height:64%;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:min(1.6vmin,8px);
    padding:min(1.6vmin,8px);
    background:linear-gradient(180deg,#151928,#0f1220);
    border-radius:14px;
    border:1px solid var(--line);
    box-shadow:0 0 0 1px rgba(255,255,255,0.02), 0 20px 60px rgba(0,0,0,0.55), inset 0 0 40px rgba(0,0,0,0.5);
    touch-action:none;
    z-index:3;
  }
  .tile{
    border-radius:8px;
    transition:background-color 0.12s ease, box-shadow 0.12s ease, transform 0.12s ease;
    background:#1a1f2f;
  }
  .tile.empty{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.04);}
  .tile.white{
    background:linear-gradient(160deg,var(--tile-white),var(--tile-white-dim));
    box-shadow:0 2px 6px rgba(0,0,0,0.4);
  }
  .tile.red{
    background:linear-gradient(160deg,#ff5779,var(--red));
    box-shadow:0 0 18px var(--red-soft),0 2px 6px rgba(0,0,0,0.4);
  }
  .tile.blue{
    background:linear-gradient(160deg,#5fc8ff,var(--blue));
    box-shadow:0 0 18px var(--blue-soft),0 2px 6px rgba(0,0,0,0.4);
  }
  .tile.pop{transform:scale(0.88);}

  /* ---------- Warning circles ---------- */
  .warn-circle{
    position:absolute;
    top:0;left:0;
    border-radius:50%;
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:2;
    will-change:width,height,opacity,box-shadow;
  }

  /* ---------- Beam flash ---------- */
  .flash-rect{
    position:absolute;
    top:0;left:0;
    pointer-events:none;
    border-radius:6px;
    z-index:4;
    opacity:1;
    transition:opacity 0.24s ease-out;
  }
  #globalFlash{
    position:absolute;
    inset:-40px;
    border-radius:24px;
    pointer-events:none;
    opacity:0;
    z-index:5;
    transition:opacity 0.18s ease-out;
  }

  /* ---------- Game over overlay ---------- */
  #gameOverOverlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;
    background:rgba(5,6,10,0.82);
    backdrop-filter:blur(2px);
    border-radius:14px;
    z-index:10;
    opacity:1;
    transition:opacity 0.25s ease;
  }
  #gameOverOverlay.hidden{opacity:0;pointer-events:none;}
  #goTitle{
    --tone:var(--red);
    font-size:clamp(24px,6vw,34px);
    text-shadow:0 0 24px var(--red-soft);
  }
  #goScore{
    --tone:var(--text-dim);
    font-size:clamp(14px,3vw,18px);
    letter-spacing:0.1em;
  }
  #retryBtn{
    margin-top:10px;
    padding:12px 34px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#fff,#c9d3e8);
    border:none;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,0.4);
    transition:transform 0.12s ease;
  }
  #retryBtn:active{transform:scale(0.94);}
  #retryBtn .btn-label{
    --tone:#0a0c12;
    font-size:14px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="scoreLabel" class="pixel-text">SCORE</div>
    <div id="scoreValue" class="pixel-text">0</div>
  </div>

  <div id="arena">
    <div id="globalFlash"></div>
    <div id="board"></div>
    <div id="gameOverOverlay" class="hidden">
      <div id="goTitle" class="pixel-text">GAME OVER</div>
      <div id="goScore" class="pixel-text">SCORE: <span id="finalScore">0</span></div>
      <button id="retryBtn"><span class="btn-label pixel-text">RETRY</span></button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* =====================================================================
   難易度・ゲームバランス定数
   ここを変更するだけで難易度カーブを調整できます。
===================================================================== */
const CONFIG = {
  PREP_TIME_MS: 1600,            // ゲーム開始〜最初の予告までの猶予

  // ビーム発射間隔 (score=0で START, scoreが増えるほど MIN に漸近)
  // DECAYを下げるほどスコア50付近で人間の反射限界に達するよう前倒しになる
  EVENT_INTERVAL_START_MS: 2500,
  EVENT_INTERVAL_MIN_MS: 620,
  EVENT_INTERVAL_DECAY: 20,

  // 予告円が出てから発射までの時間
  // START を上げて序盤をゆっくりに、DECAY を下げてスコア50付近を人間の限界に設定
  WARN_DURATION_START_MS: 2600,
  WARN_DURATION_MIN_MS: 480,
  WARN_DURATION_DECAY: 20,

  // スコア帯ごとの最大同時ビーム本数
  BEAM_COUNT_THRESHOLDS: [
    { scoreMax: 10, max: 2 },
    { scoreMax: 20, max: 3 },
    { scoreMax: Infinity, max: 4 },
  ],
  BEAM_COUNT_BIAS_SCORE: 40,     // このスコア付近で「多数本」が出やすくなりきる

  // 運だけで避け続けられないようにする仕組み:
  // FORCE_THREAT_EVERY 回に1回のビームイベントは、必ず「現在の赤 or 青タイル」の
  // 行または列を狙う本物の脅威にする(そのタイルを動かさない限り確実に被弾する)。
  FORCE_THREAT_EVERY: 3,

  CIRCLE_MIN_RATIO: 0.14,        // 予告円の最小サイズ(セル比)
  CIRCLE_MAX_RATIO: 1.0,         // 発射直前の最大サイズ(セル比)
  CIRCLE_GAP_RATIO: 0.5,         // 盤面端から予告円中心までの距離(セル比)
  BLINK_FREQ_START: 1.6,         // 出現直後の点滅速度(Hz)
  BLINK_FREQ_END: 11,            // 発射直前の点滅速度(Hz)

  FLASH_DURATION_MS: 260,
  MOVE_LOCK_MS: 120,             // 1回の入力後、次の入力を受け付けるまでの猶予
  TAP_MOVE_TOLERANCE_PX: 14,     // これ以上指が動いたらタップとみなさない
};

const INITIAL_BOARD = ["red","white","white","white","empty","white","white","white","blue"];

/* =====================================================================
   状態
===================================================================== */
let board = INITIAL_BOARD.slice();
let emptyIndex = board.indexOf("empty");
let score = 0;
let gameOver = false;
let moveLocked = false;
let pendingAction = null; // 先行入力バッファ {type:"dir",dir} または {type:"tile",index}
let nextEventTime = 0;
let eventCounter = 0;
let activeEvents = [];   // {id, total, firedCount}
let warnings = [];       // {eventId,type,index,direction,color,spawnTime,duration,fired,el}
let loopId = null;

/* =====================================================================
   DOM
===================================================================== */
const boardEl = document.getElementById("board");
const arenaEl = document.getElementById("arena");
const scoreValueEl = document.getElementById("scoreValue");
const gameOverOverlay = document.getElementById("gameOverOverlay");
const finalScoreEl = document.getElementById("finalScore");
const retryBtn = document.getElementById("retryBtn");
const globalFlashEl = document.getElementById("globalFlash");

const tileEls = [];
for(let i=0;i<9;i++){
  const d = document.createElement("div");
  d.className = "tile";
  d.dataset.index = i;
  boardEl.appendChild(d);
  tileEls.push(d);
}

/* =====================================================================
   ボード描画
===================================================================== */
function renderBoard(highlightIdx){
  for(let i=0;i<9;i++){
    tileEls[i].className = "tile " + board[i];
  }
  if(highlightIdx){
    highlightIdx.forEach(i=>{
      const el = tileEls[i];
      el.classList.add("pop");
      setTimeout(()=>el.classList.remove("pop"), 140);
    });
  }
}
renderBoard();

/* =====================================================================
   タイル移動ロジック
   規則: 入力方向に「空白マス」が移動する(隣接タイルが空白側へスライドする)

   先行入力(入力バッファ):
   反射神経を試すゲームのため、移動アニメーションのロック中(MOVE_LOCK_MS)に
   入力があっても捨てずに1件だけ保持しておき、ロックが解けた瞬間に自動で
   実行する。連続入力時は「最新の入力」で上書きする。
===================================================================== */
function releaseMoveLock(){
  moveLocked = false;
  if(!pendingAction || gameOver){ pendingAction = null; return; }
  const action = pendingAction;
  pendingAction = null;
  if(action.type === "dir") tryMove(action.dir);
  else moveTileAt(action.index);
}

function performMoveDirection(direction){
  const er = Math.floor(emptyIndex/3), ec = emptyIndex%3;
  let tr=er, tc=ec;
  if(direction==="up") tr=er-1;
  else if(direction==="down") tr=er+1;
  else if(direction==="left") tc=ec-1;
  else if(direction==="right") tc=ec+1;
  if(tr<0||tr>2||tc<0||tc>2) return;

  const targetIndex = tr*3+tc;
  const prevEmpty = emptyIndex;
  const tmp = board[emptyIndex];
  board[emptyIndex] = board[targetIndex];
  board[targetIndex] = tmp;
  emptyIndex = targetIndex;

  renderBoard([prevEmpty, targetIndex]);

  moveLocked = true;
  setTimeout(releaseMoveLock, CONFIG.MOVE_LOCK_MS);
}

function tryMove(direction){
  if(gameOver) return;
  if(moveLocked){ pendingAction = {type:"dir", dir:direction}; return; }
  performMoveDirection(direction);
}

/* ---------- キーボード操作 ---------- */
const KEY_MAP = {
  ArrowUp:"down", ArrowDown:"up", ArrowLeft:"right", ArrowRight:"left",
  w:"down", s:"up", a:"right", d:"left",
  W:"down", S:"up", A:"right", D:"left",
};
window.addEventListener("keydown", (e)=>{
  const dir = KEY_MAP[e.key];
  if(dir){
    e.preventDefault();
    tryMove(dir);
  }
});

/* ---------- タップ操作(スマホ) ----------
   タップしたタイルが空白マスに隣接している場合のみ、
   そのタイルが空白マスの方向へスライドする。
   隣接していないタイルをタップしても何も起こらない。
---------------------------------------------------- */
function performMoveToTile(index){
  const er = Math.floor(emptyIndex/3), ec = emptyIndex%3;
  const tr = Math.floor(index/3), tc = index%3;
  const isAdjacent = (Math.abs(er-tr) + Math.abs(ec-tc)) === 1;
  if(!isAdjacent) return;

  const prevEmpty = emptyIndex;
  const tmp = board[emptyIndex];
  board[emptyIndex] = board[index];
  board[index] = tmp;
  emptyIndex = index;

  renderBoard([prevEmpty, index]);

  moveLocked = true;
  setTimeout(releaseMoveLock, CONFIG.MOVE_LOCK_MS);
}

function moveTileAt(index){
  if(gameOver) return;
  if(moveLocked){ pendingAction = {type:"tile", index}; return; }
  performMoveToTile(index);
}

let touchStartX=0, touchStartY=0, touchStartEl=null, touchActive=false;
arenaEl.addEventListener("touchstart",(e)=>{
  touchActive = true;
  const t = e.touches[0];
  touchStartX = t.clientX; touchStartY = t.clientY;
  touchStartEl = t.target.closest ? t.target.closest(".tile") : null;
},{passive:true});
arenaEl.addEventListener("touchmove",(e)=>{
  if(touchActive) e.preventDefault();
},{passive:false});
arenaEl.addEventListener("touchend",(e)=>{
  if(!touchActive) return;
  touchActive = false;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const moved = Math.max(Math.abs(dx), Math.abs(dy));
  if(moved > CONFIG.TAP_MOVE_TOLERANCE_PX) return;
  if(!touchStartEl) return;
  const idx = parseInt(touchStartEl.dataset.index, 10);
  if(Number.isNaN(idx)) return;
  moveTileAt(idx);
},{passive:false});

/* =====================================================================
   難易度カーブ関数
===================================================================== */
function lerpExpDown(start,min,decay,score){
  return min + (start-min)*Math.exp(-score/decay);
}
function getEventInterval(s){ return lerpExpDown(CONFIG.EVENT_INTERVAL_START_MS, CONFIG.EVENT_INTERVAL_MIN_MS, CONFIG.EVENT_INTERVAL_DECAY, s); }
function getWarnDuration(s){ return lerpExpDown(CONFIG.WARN_DURATION_START_MS, CONFIG.WARN_DURATION_MIN_MS, CONFIG.WARN_DURATION_DECAY, s); }
function getMaxBeams(s){
  for(const t of CONFIG.BEAM_COUNT_THRESHOLDS){ if(s<=t.scoreMax) return t.max; }
  return 1;
}
function pickBeamCount(s,maxBeams){
  const bias = Math.min(1, s / CONFIG.BEAM_COUNT_BIAS_SCORE);
  const weights = [];
  for(let c=1;c<=maxBeams;c++) weights.push(1 + bias*(c-1)*2.2);
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let c=1;c<=maxBeams;c++){
    r -= weights[c-1];
    if(r<=0) return c;
  }
  return maxBeams;
}

/* =====================================================================
   ビームイベント生成
===================================================================== */
const ALL_LINES = [
  {type:"row",index:0},{type:"row",index:1},{type:"row",index:2},
  {type:"col",index:0},{type:"col",index:1},{type:"col",index:2},
];
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ---------------------------------------------------------------------
   色の割り当て(回避不能な盤面を防ぐ)
   3本の「行」または3本の「列」が全て同色になると、その色のタイルは
   盤面のどこにいても必ず被弾する(=絶対に避けられない)。
   これを防ぐため、色を割り当てた後に「行が3本とも同色」「列が3本とも同色」
   になっていないかを検査し、該当すれば1本だけ色を反転させる。
   (強制脅威ビームの色は据え置き、それ以外の1本を反転する)
--------------------------------------------------------------------- */
function assignSafeColors(lines){
  lines.forEach(l=>{
    l.color = l.forcedColor ? l.forcedColor : (Math.random()<0.5 ? "red" : "blue");
  });
  ["red","blue"].forEach(color=>{
    const rowLines = lines.filter(l=>l.type==="row" && l.color===color);
    if(rowLines.length>=3){
      const target = rowLines.find(l=>!l.forcedColor) || rowLines[0];
      target.color = (color==="red") ? "blue" : "red";
    }
    const colLines = lines.filter(l=>l.type==="col" && l.color===color);
    if(colLines.length>=3){
      const target = colLines.find(l=>!l.forcedColor) || colLines[0];
      target.color = (color==="red") ? "blue" : "red";
    }
  });
}

function spawnEvent(now){
  const maxBeams = getMaxBeams(score);
  const count = pickBeamCount(score, maxBeams);
  const duration = getWarnDuration(score);
  const eventId = ++eventCounter;

  // FORCE_THREAT_EVERY 回に1回は、現在の赤 or 青タイルの行/列を狙う
  // 「動かなければ確実に当たる」本物の脅威ビームを必ず1本含める。
  const isForced = (eventCounter % CONFIG.FORCE_THREAT_EVERY) === 0;

  let lines;
  if(isForced){
    const threatColor = Math.random()<0.5 ? "red" : "blue";
    const threatIndex = board.indexOf(threatColor);
    const tr = Math.floor(threatIndex/3), tc = threatIndex%3;
    const useRow = Math.random()<0.5;
    const forcedLine = useRow
      ? {type:"row", index:tr, forcedColor:threatColor}
      : {type:"col", index:tc, forcedColor:threatColor};
    const remaining = ALL_LINES.filter(l => !(l.type===forcedLine.type && l.index===forcedLine.index));
    lines = [forcedLine, ...shuffle(remaining).slice(0, Math.max(0, count-1))];
  } else {
    lines = shuffle(ALL_LINES).slice(0,count); // 同一イベント内で行/列の重複なし
  }

  assignSafeColors(lines); // 「同色ビームで盤面が全マス埋まる」回避不能な配置を防ぐ

  activeEvents.push({id:eventId, total:lines.length, firedCount:0});

  lines.forEach(line=>{
    const direction = line.type==="row"
      ? (Math.random()<0.5 ? "LR" : "RL")
      : (Math.random()<0.5 ? "TB" : "BT");
    const color = line.color;
    const el = document.createElement("div");
    el.className = "warn-circle warn-" + color;
    arenaEl.appendChild(el);
    warnings.push({
      eventId, type:line.type, index:line.index, direction, color,
      spawnTime:now, duration, fired:false, el,
    });
  });
}

/* =====================================================================
   予告円の描画位置・スタイル更新
===================================================================== */
function getGeometry(){
  const boardRect = boardEl.getBoundingClientRect();
  const arenaRect = arenaEl.getBoundingClientRect();
  return {
    left: boardRect.left - arenaRect.left,
    top: boardRect.top - arenaRect.top,
    w: boardRect.width,
    h: boardRect.height,
    cell: boardRect.width/3,
  };
}

function warnCenter(w, geo){
  const {left,top,w:bw,h:bh,cell} = geo;
  const gap = cell * CONFIG.CIRCLE_GAP_RATIO;
  if(w.type==="row"){
    const cy = top + cell*(w.index+0.5);
    const cx = (w.direction==="LR") ? (left - gap) : (left + bw + gap);
    return {cx,cy};
  } else {
    const cx = left + cell*(w.index+0.5);
    const cy = (w.direction==="TB") ? (top - gap) : (top + bh + gap);
    return {cx,cy};
  }
}

function updateWarningVisual(w, progress, geo, now){
  const {cx,cy} = warnCenter(w, geo);
  const size = geo.cell * (CONFIG.CIRCLE_MIN_RATIO + (CONFIG.CIRCLE_MAX_RATIO-CONFIG.CIRCLE_MIN_RATIO)*progress);
  const freq = CONFIG.BLINK_FREQ_START + (CONFIG.BLINK_FREQ_END-CONFIG.BLINK_FREQ_START)*progress;
  const blink = 0.55 + 0.45*Math.abs(Math.sin((now/1000)*freq*Math.PI*2));
  const glow = 8 + 26*progress;
  const colorMain = w.color==="red" ? "#ff3358" : "#2fb2ff";
  const colorSoft = w.color==="red" ? "rgba(255,51,88,0.85)" : "rgba(47,178,255,0.85)";

  const el = w.el;
  el.style.left = cx + "px";
  el.style.top = cy + "px";
  el.style.width = size + "px";
  el.style.height = size + "px";
  el.style.opacity = blink.toFixed(3);
  el.style.background = `radial-gradient(circle, #fff 0%, ${colorMain} 45%, ${colorSoft} 100%)`;
  el.style.boxShadow = `0 0 ${glow}px ${glow*0.6}px ${colorSoft}`;
}

/* =====================================================================
   フラッシュ演出
===================================================================== */
function spawnFlash(w, geo){
  const {left,top,w:bw,h:bh,cell} = geo;
  const el = document.createElement("div");
  const colorSoft = w.color==="red" ? "var(--red-soft)" : "var(--blue-soft)";
  el.className = "flash-rect flash-" + w.color;
  el.style.background = `linear-gradient(${w.type==="row"?"90deg":"0deg"}, transparent, ${colorSoft}, transparent)`;
  el.style.boxShadow = `0 0 30px 6px ${colorSoft}`;

  if(w.type==="row"){
    el.style.left = left + "px";
    el.style.top = (top + cell*w.index) + "px";
    el.style.width = bw + "px";
    el.style.height = cell + "px";
  } else {
    el.style.left = (left + cell*w.index) + "px";
    el.style.top = top + "px";
    el.style.width = cell + "px";
    el.style.height = bh + "px";
  }
  arenaEl.appendChild(el);
  requestAnimationFrame(()=>{ el.style.opacity = "0"; });
  setTimeout(()=>{ el.remove(); }, CONFIG.FLASH_DURATION_MS+60);

  globalFlashEl.style.background = `radial-gradient(circle, ${colorSoft}, transparent 70%)`;
  globalFlashEl.style.opacity = "0.5";
  requestAnimationFrame(()=>{
    setTimeout(()=>{ globalFlashEl.style.opacity = "0"; }, 40);
  });
}

/* =====================================================================
   当たり判定
===================================================================== */
function checkHit(w){
  let cells;
  if(w.type==="row") cells = [w.index*3, w.index*3+1, w.index*3+2];
  else cells = [w.index, w.index+3, w.index+6];
  return cells.some(i=>board[i]===w.color);
}

/* =====================================================================
   メインループ
===================================================================== */
function fireWarning(w, geo){
  w.fired = true;
  if(w.el && w.el.parentNode) w.el.remove();
  spawnFlash(w, geo);

  const hit = checkHit(w);
  if(hit){
    triggerGameOver();
    return true;
  }
  const ev = activeEvents.find(e=>e.id===w.eventId);
  if(ev){
    ev.firedCount++;
    if(ev.firedCount>=ev.total){
      score++;
      scoreValueEl.textContent = score;
      scoreValueEl.classList.add("pop");
      setTimeout(()=>scoreValueEl.classList.remove("pop"),150);
      activeEvents = activeEvents.filter(e=>e.id!==ev.id);
    }
  }
  return false;
}

function updateWarnings(now){
  const geo = getGeometry();
  for(const w of warnings){
    if(w.fired) continue;
    const elapsed = now - w.spawnTime;
    const progress = Math.min(1, elapsed/w.duration);
    updateWarningVisual(w, progress, geo, now);
    if(elapsed >= w.duration){
      const hit = fireWarning(w, geo);
      if(hit) return;
    }
  }
  warnings = warnings.filter(w=>!w.fired);
}

function loop(now){
  updateWarnings(now);
  if(gameOver) return;
  if(now >= nextEventTime){
    spawnEvent(now);
    nextEventTime = now + getEventInterval(score);
  }
  loopId = requestAnimationFrame(loop);
}

/* =====================================================================
   ゲームオーバー / リトライ
===================================================================== */
function triggerGameOver(){
  gameOver = true;
  if(loopId) cancelAnimationFrame(loopId);
  warnings.forEach(w=>{ if(w.el && w.el.parentNode) w.el.remove(); });
  warnings = [];
  activeEvents = [];
  finalScoreEl.textContent = score;
  gameOverOverlay.classList.remove("hidden");
  arenaEl.classList.add("shake");
  setTimeout(()=>arenaEl.classList.remove("shake"), 420);
}

function resetGame(){
  board = INITIAL_BOARD.slice();
  emptyIndex = board.indexOf("empty");
  score = 0;
  gameOver = false;
  moveLocked = false;
  pendingAction = null;
  eventCounter = 0;
  activeEvents = [];
  warnings.forEach(w=>{ if(w.el && w.el.parentNode) w.el.remove(); });
  warnings = [];

  scoreValueEl.textContent = "0";
  renderBoard();
  gameOverOverlay.classList.add("hidden");

  const now = performance.now();
  nextEventTime = now + CONFIG.PREP_TIME_MS;
  loopId = requestAnimationFrame(loop);
}

retryBtn.addEventListener("click", ()=>{
  resetGame();
});

/* =====================================================================
   起動
===================================================================== */
const startNow = performance.now();
nextEventTime = startNow + CONFIG.PREP_TIME_MS;
loopId = requestAnimationFrame(loop);

})();
</script>
